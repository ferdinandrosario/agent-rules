name: Secrets guard

# Fails the build if a secret file is ever tracked in git. Catches the
# "committed master.key / .env" class of mistake before it reaches a branch.
#
# Allowed (intentionally tracked): the ENCRYPTED Rails credentials
# (config/credentials.yml.enc) and *.env.example templates.
# Blocked: the decrypting key (master.key), real .env files, per-env
# credential keys, TLS/SSH private keys (*.pem, id_rsa, id_ed25519).
#
# Runs on every PR and every push to main (no path filter — a secret can
# be added from any change), mirroring the always-on safety intent.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: secrets-guard-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  no-tracked-secrets:
    name: No tracked secret files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Fail on any tracked secret file
        run: |
          tracked=$(git ls-files \
            | grep -E '(^|/)\.env(\.[^/]*)?$|(^|/)master\.key$|\.pem$|(^|/)id_(rsa|ed25519)$|(^|/)config/credentials/.+\.key$' \
            | grep -vE '\.env\.example$' || true)
          if [ -n "$tracked" ]; then
            echo "::error::Secret file(s) tracked in git. Remove with 'git rm --cached <file>', add to .gitignore, and ROTATE the secret (history still holds it):"
            echo "$tracked"
            exit 1
          fi
          echo "✓ no tracked secret files"
