version: 2

# Template repo's OWN Dependabot config: github-actions only, because the
# template carries workflows but no backend/web/mobile code — a codebase
# ecosystem entry here would fail weekly against a directory that doesn't
# exist (Dependabot has no equivalent of the workflows' template-only
# `if:` guard).
#
# The full app config lives in dependabot-app.yml; stamp.sh moves it over
# this file, so a stamped app gets all four ecosystems.

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - ci
